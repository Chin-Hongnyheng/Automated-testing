<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Cloud Storage</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3eb;
        --card: #fffdf9;
        --ink: #1e1a16;
        --muted: #675c4f;
        --accent: #0e7a86;
        --accent-2: #e36b2c;
      }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #f7f3eb, #efe2cc);
        color: var(--ink);
      }
      .shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      .hero,
      .panel {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      }
      .hero {
        padding: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 20px;
      }
      .hero h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
      }
      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(14, 122, 134, 0.1);
        color: var(--accent);
        font-weight: 700;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
      }
      .panel {
        padding: 20px;
      }
      .panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }
      form {
        display: grid;
        gap: 10px;
      }
      input,
      button {
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      button.secondary {
        background: var(--accent-2);
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      li {
        padding: 10px 12px;
        border: 1px solid #eee;
        border-radius: 10px;
        background: #fff;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div>
          <h1>Private Cloud Storage</h1>
          <p>
            Welcome back, <strong th:text="${user.displayName}">User</strong>.
          </p>
        </div>
        <div class="stats">
          <div class="chip">
            Quota: <span id="quotaMb" th:text="${quotaMb}">50</span> MB
          </div>
          <div class="chip">
            Used: <span id="usedMb" th:text="${usedMb}">0</span> MB
          </div>
        </div>
      </section>

      <div class="grid">
        <section class="panel">
          <h2>Create Folder</h2>
          <form id="create-folder-form" action="/folders" method="post">
            <input name="name" placeholder="Folder name" required />
            <button type="submit">Create Folder</button>
          </form>
          <h2 style="margin-top: 18px">Upload File</h2>
          <form
            id="upload-form"
            action="/upload"
            method="post"
            enctype="multipart/form-data"
          >
            <input type="file" name="file" required />
            <label>
              Upload to folder
              <select name="folderId">
                <option value="">Root</option>
                <option
                  th:each="folder : ${folders}"
                  th:value="${folder.id}"
                  th:text="${folder.name}"
                ></option>
              </select>
            </label>
            <button type="submit" class="secondary">Upload File</button>
          </form>
          <form action="/delete-account" method="post" style="margin-top: 16px">
            <button type="submit" class="secondary">Delete Account</button>
          </form>
        </section>

        <section class="panel">
          <h2>Your Files</h2>
          <ul id="files-list">
            <li th:each="file : ${files}">
              <strong th:text="${file.name}">file</strong>
              <span class="muted"
                >• <span th:text="${file.sizeBytes}">0</span> bytes</span
              >
            </li>
          </ul>
          <h2 style="margin-top: 18px">Your Folders</h2>
          <ul id="folders-list">
            <li th:each="folder : ${folders}">
              <strong th:text="${folder.name}">folder</strong>
            </li>
          </ul>
        </section>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function escapeHtml(s) {
          return String(s).replace(/[&<>'"]/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        const createForm = document.getElementById("create-folder-form");
        if (createForm) {
          createForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = new FormData(createForm);
            const name = form.get("name");
            try {
              const res = await fetch("/api/folders", {
                method: "POST",
                body: new URLSearchParams({ name }),
                credentials: "same-origin",
              });
              if (!res.ok) throw res;
              const json = await res.json();
              const ul = document.getElementById("folders-list");
              const li = document.createElement("li");
              li.innerHTML = `<strong>${escapeHtml(json.name)}</strong>`;
              ul.appendChild(li);
              // add option to upload select so new folder can be chosen immediately
              const select = document.querySelector('select[name="folderId"]');
              if (select) {
                const opt = document.createElement("option");
                opt.value = json.id;
                opt.textContent = json.name;
                select.appendChild(opt);
                // select the new folder by default
                select.value = json.id;
                currentFolderId = String(json.id);
                fetchFiles(currentFolderId);
              }
              createForm.reset();
            } catch (err) {
              console.error("Create folder failed", err);
              alert("Could not create folder");
            }
          });
        }

        // current folder filter (null or id)
        let currentFolderId = null;

        const folderSelect = document.querySelector('select[name="folderId"]');
        if (folderSelect) {
          folderSelect.addEventListener("change", function () {
            const v = folderSelect.value;
            currentFolderId = v === "" ? null : v;
            fetchFiles(currentFolderId);
          });
        }

        async function fetchFiles(folderId) {
          try {
            const url = folderId
              ? `/api/files?folderId=${encodeURIComponent(folderId)}`
              : "/api/files";
            const res = await fetch(url, { credentials: "same-origin" });
            if (!res.ok) throw res;
            const list = await res.json();
            const ul = document.getElementById("files-list");
            ul.innerHTML = "";
            for (const f of list) {
              const li = document.createElement("li");
              li.innerHTML = `<strong>${escapeHtml(f.name)}</strong> <span class="muted">• ${f.sizeBytes} bytes</span>`;
              ul.appendChild(li);
            }
          } catch (err) {
            console.error("Fetch files failed", err);
          }
        }

        async function updateUsed() {
          try {
            const res = await fetch("/api/me", { credentials: "same-origin" });
            if (!res.ok) return;
            const data = await res.json();
            const usedEl = document.getElementById("usedMb");
            usedEl.textContent = (
              (data.usedBytes || 0) /
              (1024 * 1024)
            ).toFixed(2);
            const quotaEl = document.getElementById("quotaMb");
            quotaEl.textContent = (
              (data.quotaBytes || 0) /
              (1024 * 1024)
            ).toFixed(0);
          } catch (err) {
            console.error("Update used failed", err);
          }
        }

        const uploadForm = document.getElementById("upload-form");
        if (uploadForm) {
          uploadForm.addEventListener("submit", async function (e) {
            e.preventDefault();
            const fd = new FormData(uploadForm);
            try {
              const res = await fetch("/api/files", {
                method: "POST",
                body: fd,
                credentials: "same-origin",
              });
              if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw err;
              }
              await res.json();
              // refresh files for selected folder (read from form) and update used/quota
              const selectedFolder = fd.get("folderId");
              currentFolderId =
                selectedFolder === "" ? null : String(selectedFolder);
              fetchFiles(currentFolderId);
              updateUsed();
              uploadForm.reset();
            } catch (err) {
              console.error("Upload failed", err);
              alert(err && err.error ? err.error : "Upload failed");
            }
          });
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Private Cloud Storage</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f7f3eb;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 24px;
        border-radius: 16px;
        width: min(420px, 92vw);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        gap: 10px;
      }
      input,
      button {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #ddd;
        font: inherit;
      }
      button {
        background: #0e7a86;
        color: white;
        border: none;
        cursor: pointer;
      }
      a {
        color: #0e7a86;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Login</h1>
      <form method="post" action="/login">
        <input name="username" placeholder="Email" required />
        <input
          name="password"
          type="password"
          placeholder="Password"
          required
        />
        <button type="submit">Sign in</button>
      </form>
      <p>Need an account? <a href="/register">Register</a></p>
    </div>
  </body>
</html>
